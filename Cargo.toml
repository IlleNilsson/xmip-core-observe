# Its own workspace root, so this repository builds on its own.
[workspace]

[package]
name = "xmip-core-observe"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://github.com/IlleNilsson/xmip-core-observe"
description = "Near-real-time operational observation contracts for Xmip."

[lib]
# A host crate: the exporters mount beside this source (ADR-0049).
path = ".src/lib.rs"

[dependencies]
xcore = { package = "xmip-core", git = "https://github.com/IlleNilsson/xmip-core", branch = "main" }
# The stage a count is taken at, the capability a node publishes and the
# scope everything sits at are the node crate's; observe says where they sit
# in a snapshot and what they count.
node = { package = "xmip-core-node", git = "https://github.com/IlleNilsson/xmip-core-node", branch = "main" }
# A publication is a TOML file (on disk the estate is TOML); serde derives
# its shape and toml writes and reads it, here and nowhere else.
serde = { version = "1", features = ["derive"] }
# RFC 3339, how an unheard member's time is said: codec's one writer.
codec = { package = "xmip-core-library-codec", git = "https://github.com/IlleNilsson/xmip-core-library-codec", branch = "main" }
toml = "1"

# The module's timing program (`doc/governance/rust-style.md` section 5c):
# a plain `cargo test` leaves it out, and the landing runs it after every
# other test here, alone, one test at a time, so what it measures is Xmip's
# work.
[[test]]
name = "measured"
path = "tests/measured/main.rs"
test = false

[dev-dependencies]
# The test cluster's names, from its `cluster.xmip` (`configure::fixture`).
configure = { package = "xmip-core-configure", git = "https://github.com/IlleNilsson/xmip-core-configure", branch = "main", features = ["test-support"] }
# The one latency spread the estate's timing programs hold (`xcore::latency`).
xcore = { package = "xmip-core", git = "https://github.com/IlleNilsson/xmip-core", branch = "main", features = ["test-support"] }

[profile.dev.package."*"]
opt-level = 3
