# Its own workspace root, so this repository builds on its own.
[workspace]

[package]
name = "xmip-core-observe"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://github.com/IlleNilsson/xmip-core-observe"
description = "Near-real-time operational observation contracts for Xmip."

[dependencies]
xcore = { package = "xmip-core", git = "https://github.com/IlleNilsson/xmip-core", branch = "main" }
# The stage a count is taken at and the capability a node publishes are the
# node crate's; observe says where they sit in a snapshot and what they count.
node = { package = "xmip-core-node", git = "https://github.com/IlleNilsson/xmip-core-node", branch = "main" }
# A publication is a TOML file (on disk the estate is TOML); serde derives
# its shape and toml writes and reads it, here and nowhere else.
serde = { version = "1", features = ["derive"] }
toml = "0.8"
